[package]
name = "rspg"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# Not used directly (we use ratatui::crossterm). Listed only to enable
# `use-dev-tty`: a pager's stdin is the data pipe, so keys come from /dev/tty,
# and the default kqueue-based reader can't poll /dev/tty on macOS
# ("Failed to initialize input reader"). Must match ratatui's crossterm version.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
tempfile = "3.27.0"
unicode-width = "0.2.3"
